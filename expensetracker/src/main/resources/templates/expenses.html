
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
        }

        h1 {
            text-align: center;
            color: #273c75;
        }

        .total {
            background: #e8f8f0;
            padding: 15px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border-radius: 5px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #273c75;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #192a56;
        }

        .cancel {
            display: inline-block;
            margin-top: 10px;
            color: #273c75;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #273c75;
            color: white;
        }

        .actions a {
            margin-right: 10px;
        }

        .message {
            color: green;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 12px;
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>My Expense Tracker</h1>

    <div class="total">
        Total Expenses: ₹<span
            th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span>
    </div>

    <p class="message"
       th:if="${message}"
       th:text="${message}"></p>

    <h2 th:text="${expense.id == null ? 'Add Expense' : 'Edit Expense'}">
        Add Expense
    </h2>

    <form th:action="${expense.id == null
                    ? '/add'
                    : '/update/' + expense.id}"
          th:object="${expense}"
          method="post">

        <input type="text"
               th:field="*{title}"
               placeholder="Expense title"
               required>

        <input type="number"
               th:field="*{amount}"
               placeholder="Amount (₹)"
               min="0.01"
               step="0.01"
               required>

        <input type="text"
               th:field="*{category}"
               placeholder="Category"
               required>

        <label for="date">Date:</label>

        <input type="date"
               id="date"
               th:field="*{date}"
               required>

        <button type="submit"
                th:text="${expense.id == null
                         ? 'Add Expense'
                         : 'Update Expense'}">
            Add Expense
        </button>

        <a class="cancel"
           th:if="${expense.id != null}"
           th:href="@{/}">
            Cancel Editing
        </a>
    </form>

    <h2>Expense History</h2>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${expenses}">
            <td th:text="${item.title}"></td>

            <td>
                ₹<span th:text="${#numbers.formatDecimal(item.amount, 1, 2)}"></span>
            </td>

            <td th:text="${item.category}"></td>

            <td th:text="${item.date}"></td>

            <td class="actions">
                <a th:href="@{/edit/{id}(id=${item.id})}">Edit</a>

                <a th:href="@{/delete/{id}(id=${item.id})}"
                   onclick="return confirm('Are you sure you want to delete this expense?')">
                    Delete
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(expenses)}">
            <td colspan="5" class="empty">
                No expenses added yet.
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
